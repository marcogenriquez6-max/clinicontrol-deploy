# CliniControl - nginx para Render
# Sirve el SPA desde /app/frontend/dist y deriva hacia la API
# (http://127.0.0.1:4000) las peticiones de datos, detectadas por la
# cabecera Accept (misma heurística que usa el proxy de Vite en dev):
#   - Accept: text/html          -> navegación SPA -> index.html
#   - cualquier otro Accept      -> llamada a la API -> backend

map $http_accept $is_api {
    default          1;
    "~*text/html"    0;
}

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_read_timeout 300s;
client_max_body_size 100m;

server {
    listen 80 default_server;
    server_name _;

    root /app/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Health check de Render (siempre al backend)
    location = /health {
        proxy_pass http://127.0.0.1:4000;
    }

    # Assets estáticos con caché larga
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Todo lo demás: archivo real -> API -> SPA
    location / {
        set $target @index;
        if ($is_api) { set $target @api; }
        try_files $uri $uri/ $target;
    }

    location @api {
        proxy_pass http://127.0.0.1:4000;
    }

    location @index {
        try_files $uri /index.html;
    }
}